# CI: lint, format, test, build, and validate on push/PR to main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run validate:docs

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate build output
        run: |
          # Verify static export produced index.html
          test -f out/index.html || { echo "::error::out/index.html not found"; exit 1; }

          # Verify resume content is present in the build
          grep -qi "Professional Summary" out/index.html || { echo "::error::Resume content missing from build output"; exit 1; }

          # Verify download files exist in the build
          test -f out/Paul-Prae-Resume.pdf || echo "::warning::PDF download not in build output"
          test -f out/Paul-Prae-Resume.docx || echo "::warning::DOCX download not in build output"
          test -f out/Paul-Prae-Resume.md || echo "::warning::MD download not in build output"

          echo "Build output validated successfully"
